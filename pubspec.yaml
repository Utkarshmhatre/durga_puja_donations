name: durga_puja_donations
description: "A new Flutter project."

# Prevent accidental publishing to pub.dev.
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  test: ^1.21.0
  url_launcher: ^6.1.7  # For Stripe payments, or razorpay_flutter for Razorpay
  pdf: ^3.5.0
  path_provider: ^2.1.4  # To access device storage
  flutter_local_notifications: ^17.2.2  # Optional: for notifications
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.2.2  # For local data persistence
  table_calendar: ^3.0.0
  animate_do: ^3.3.4
  cached_network_image: ^3.4.1
  phonepe_payment_sdk: ^2.0.3
  crypto: ^3.0.5
  percent_indicator: ^4.2.3
  webview_flutter: ^4.4.2  # For playing YouTube in WebView
  image_picker: ^1.0.7  # For local image picking
  local_auth: ^2.3.0
  intl: any  # For localization date/number formatting
  fl_chart: ^0.69.2  # Admin dashboard charts
  csv: ^6.0.0  # Donation CSV export
  share_plus: ^10.1.4  # Social sharing
  hive: ^2.2.3  # Fast local persistence (Phase 5)
  hive_flutter: ^1.1.0  # Hive Flutter bindings


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  qr_flutter: ^4.1.0
  hive_generator: ^2.0.1  # Hive adapter code generation
  build_runner: ^2.4.8  # Code generation runner

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  fonts:
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Light.ttf
          weight: 300
        - asset: assets/fonts/HindSiliguri-Regular.ttf
          weight: 400
        - asset: assets/fonts/HindSiliguri-Medium.ttf
          weight: 500
        - asset: assets/fonts/HindSiliguri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindSiliguri-Bold.ttf
          weight: 700

  assets:
    # Add assets from the images directory to the application.
    - assets/events.jpg
    - assets/starter_background.jpg
    - assets/event2.jpg
    - assets/event3.jpg
    - assets/background.jpg
    - assets/logo.png
    - assets/images/Sun-Yellow.png
    - assets/images/Sun-Red.png
    - assets/images/Moon-Crescent.png
    - assets/images/Bg-Red.png
    - assets/images/Illustration-Red.png
    - assets/images/Slider-Red.png
    - assets/images/Bg-Yellow.png
    - assets/images/Illustration-Yellow.png
    - assets/images/Slider-Yellow.png
    - assets/images/Illustration-Blue.png
    - assets/images/Slider-Blue.png
    - assets/images/Bg-Blue.png
    - assets/images/history_image.png
    - assets/images/durga_maa_significance.png
    - assets/images/preparation_celebration.png
    - assets/images/rituals_customs.png
    - assets/images/pandals_idols.png
    - assets/images/procession_immersion.png
    - assets/images/bengali_culture.png
    - assets/images/conclusion.png
    - assets/images/durga_mata_image.jpg
    - assets/images/your_logo.png
    
dependency_overrides:
  http: ^0.13.0
  flutter_inappwebview_android: ^1.1.3
